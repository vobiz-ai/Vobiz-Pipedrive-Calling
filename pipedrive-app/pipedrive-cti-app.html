<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoBiz Calling - Pipedrive CTI</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi">
  <style>
    :root {
      --orange-500: #ea580c;
      --orange-600: #c2410c;
      --orange-soft: rgb(234 88 12 / 0.1);
      --bg: #f8fafc;
      --card: #ffffff;
      --sunken: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --ok: #15803d;
      --ok-soft: rgb(21 128 61 / 0.1);
      --err: #dc2626;
      --err-soft: rgb(220 38 38 / 0.1);
      --r: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Satoshi", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      font-size: 13px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .status-badge {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--orange-soft);
      color: var(--orange-500);
    }
    .status-badge.is-ok { background: var(--ok-soft); color: var(--ok); }
    .status-badge.is-err { background: var(--err-soft); color: var(--err); }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      padding: 3px;
      border-radius: 8px;
      background: var(--sunken);
    }
    .tab {
      flex: 1;
      padding: 5px 8px;
      border: none;
      border-radius: 6px;
      background: none;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-3);
      cursor: pointer;
      text-align: center;
    }
    .tab.is-active {
      background: var(--card);
      color: var(--orange-500);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.06);
    }
    .form-group { margin-bottom: 10px; }
    .field-label {
      display: block;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .input {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: var(--sunken);
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      outline: none;
    }
    .input:focus {
      border-color: var(--orange-500);
    }
    .btn {
      width: 100%;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: var(--r);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn-primary { background: var(--orange-500); color: #fff; }
    .btn-primary:hover { background: var(--orange-600); }
    .btn-logout {
      background: none;
      border: none;
      color: var(--err);
      font-size: 11px;
      cursor: pointer;
      margin-top: 6px;
      text-decoration: underline;
    }
    .log-box {
      margin-top: 12px;
      font-size: 11px;
      background: var(--sunken);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: var(--r);
      max-height: 80px;
      overflow-y: auto;
      font-family: monospace;
      color: var(--text-2);
    }
    .hidden { display: none !important; }
    .alert-error {
      font-size: 11.5px;
      color: var(--err);
      background: var(--err-soft);
      border: 1px solid var(--err);
      padding: 6px 10px;
      border-radius: var(--r);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="brand">
        <svg width="22" height="16" viewBox="0 0 42 30" fill="none">
          <path d="M42 14.7458V0C24.5641 0 12 13.7288 12 30H27.1282C27.1282 21.3559 33.5385 14.7458 42 14.7458Z" fill="#E83C00"/>
          <path d="M0 15V0C9.28572 0 15 6.42857 15 15H0Z" fill="#E86A00"/>
        </svg>
        <h2>Vobiz Telephony</h2>
      </div>
      <span id="ctiBadge" class="status-badge">Sign In</span>
    </div>

    <!-- Login View -->
    <div id="ctiLoginView">
      <div id="ctiErrorMsg" class="alert-error hidden">Invalid credentials</div>

      <!-- Dual Login Tabs -->
      <div class="tabs">
        <button type="button" id="tabAccount" class="tab is-active">Vobiz account</button>
        <button type="button" id="tabSip" class="tab">SIP direct</button>
      </div>

      <!-- Tab Account -->
      <div id="panelAccount">
        <div class="form-group">
          <label class="field-label" for="ctiAuthId">Auth ID</label>
          <input type="text" id="ctiAuthId" class="input" placeholder="MA_XXXXXXXX" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="field-label" for="ctiAuthToken">Auth Token</label>
          <input type="password" id="ctiAuthToken" class="input" placeholder="Vobiz Auth Token" autocomplete="off">
        </div>
        <button id="ctiLoginBtn" class="btn btn-primary" type="button">Sign in to Vobiz</button>
      </div>

      <!-- Tab SIP Direct -->
      <div id="panelSip" class="hidden">
        <div class="form-group">
          <label class="field-label" for="ctiSipUser">SIP Username</label>
          <input type="text" id="ctiSipUser" class="input" placeholder="playXXXXXXXXXXXX" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="field-label" for="ctiSipPass">SIP Password</label>
          <input type="password" id="ctiSipPass" class="input" placeholder="Endpoint password" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="field-label" for="ctiCallerId">Calling From (Caller ID)</label>
          <input type="tel" id="ctiCallerId" class="input" placeholder="+91XXXXXXXXXX" autocomplete="off">
        </div>
        <button id="ctiSipConnectBtn" class="btn btn-primary" type="button">Connect SIP Direct</button>
      </div>
    </div>

    <!-- Dialer View -->
    <div id="ctiDialerView" class="hidden">
      <div class="form-group">
        <label class="field-label" for="pdPhone">Recipient Phone Number</label>
        <input type="tel" id="pdPhone" class="input" value="+15550192834" placeholder="+1..." style="font-weight:600;">
      </div>
      <button id="pdDialBtn" class="btn btn-primary" type="button">📞 Dial via VoBiz</button>
      <button id="ctiLogoutBtn" class="btn-logout" type="button">Sign out</button>
    </div>

    <div id="pdLog" class="log-box">Sign in with VoBiz account or SIP direct credentials.</div>
  </div>

  <script>
    const ctiLoginView = document.getElementById("ctiLoginView");
    const ctiDialerView = document.getElementById("ctiDialerView");
    const ctiBadge = document.getElementById("ctiBadge");
    const tabAccount = document.getElementById("tabAccount");
    const tabSip = document.getElementById("tabSip");
    const panelAccount = document.getElementById("panelAccount");
    const panelSip = document.getElementById("panelSip");

    const ctiAuthId = document.getElementById("ctiAuthId");
    const ctiAuthToken = document.getElementById("ctiAuthToken");
    const ctiLoginBtn = document.getElementById("ctiLoginBtn");
    const ctiSipUser = document.getElementById("ctiSipUser");
    const ctiSipPass = document.getElementById("ctiSipPass");
    const ctiCallerId = document.getElementById("ctiCallerId");
    const ctiSipConnectBtn = document.getElementById("ctiSipConnectBtn");
    const ctiLogoutBtn = document.getElementById("ctiLogoutBtn");
    const ctiErrorMsg = document.getElementById("ctiErrorMsg");
    const pdPhone = document.getElementById("pdPhone");
    const pdDialBtn = document.getElementById("pdDialBtn");
    const pdLog = document.getElementById("pdLog");

    tabAccount.addEventListener("click", () => {
      tabAccount.classList.add("is-active");
      tabSip.classList.remove("is-active");
      panelAccount.classList.remove("hidden");
      panelSip.classList.add("hidden");
    });

    tabSip.addEventListener("click", () => {
      tabSip.classList.add("is-active");
      tabAccount.classList.remove("is-active");
      panelSip.classList.remove("hidden");
      panelAccount.classList.add("hidden");
    });

    function checkAuth() {
      const session = sessionStorage.getItem("vobiz_pipedrive_session");
      if (session) {
        const parsed = JSON.parse(session);
        ctiLoginView.classList.add("hidden");
        ctiDialerView.classList.remove("hidden");
        ctiBadge.textContent = "READY";
        ctiBadge.className = "status-badge is-ok";
        pdLog.textContent = `Connected as ${parsed.agentName || parsed.authId || 'Agent'}. Ready to dial.`;
      } else {
        ctiLoginView.classList.remove("hidden");
        ctiDialerView.classList.add("hidden");
        ctiBadge.textContent = "SIGN IN";
        ctiBadge.className = "status-badge";
        pdLog.textContent = "Please sign in with VoBiz credentials.";
      }
    }

    ctiLoginBtn.addEventListener("click", async () => {
      const authId = ctiAuthId.value.trim();
      const authToken = ctiAuthToken.value.trim();
      if (!authId || !authToken) {
        ctiErrorMsg.textContent = "Enter both Auth ID and Auth Token.";
        ctiErrorMsg.classList.remove("hidden");
        return;
      }
      ctiErrorMsg.classList.add("hidden");
      pdLog.textContent = "Authenticating with VoBiz…";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ authId, authToken, agentId: "admin" })
        });
        const json = await res.json();
        if (res.ok && json.success) {
          sessionStorage.setItem("vobiz_pipedrive_session", JSON.stringify({
            authId: json.authId,
            token: json.token,
            agentName: json.agent?.name || "System Administrator"
          }));
          checkAuth();
        } else {
          ctiErrorMsg.textContent = json.error || "Login failed";
          ctiErrorMsg.classList.remove("hidden");
        }
      } catch (e) {
        ctiErrorMsg.textContent = "Network error: " + e.message;
        ctiErrorMsg.classList.remove("hidden");
      }
    });

    ctiSipConnectBtn.addEventListener("click", async () => {
      const sipUser = ctiSipUser.value.trim();
      const password = ctiSipPass.value;
      const callerId = ctiCallerId.value.trim();
      if (!sipUser || !password || !callerId) {
        ctiErrorMsg.textContent = "Enter SIP username, password, and caller ID.";
        ctiErrorMsg.classList.remove("hidden");
        return;
      }
      ctiErrorMsg.classList.add("hidden");
      pdLog.textContent = `Connecting SIP direct as ${sipUser}…`;

      try {
        await fetch("/login-sip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sipUser, callerId })
        });
        sessionStorage.setItem("vobiz_pipedrive_session", JSON.stringify({
          authId: sipUser,
          token: "sip-direct",
          agentName: sipUser
        }));
        checkAuth();
      } catch (e) {
        ctiErrorMsg.textContent = "SIP error: " + e.message;
        ctiErrorMsg.classList.remove("hidden");
      }
    });

    ctiLogoutBtn.addEventListener("click", () => {
      sessionStorage.removeItem("vobiz_pipedrive_session");
      checkAuth();
    });

    pdDialBtn.addEventListener("click", async () => {
      const phone = pdPhone.value.trim();
      const session = JSON.parse(sessionStorage.getItem("vobiz_pipedrive_session") || "{}");
      pdLog.textContent = `Placing VoBiz call to ${phone}…`;
      try {
        const res = await fetch("/start-call", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            to: phone,
            agentId: "admin",
            authId: session.authId,
            authToken: session.authToken
          })
        });
        const json = await res.json();
        if (res.ok && json.success) {
          pdLog.textContent = `Call initiated! UUID: ${json.callUuid}`;
        } else {
          pdLog.textContent = `Call notice: ${json.error || "Processed"}`;
        }
      } catch (e) {
        pdLog.textContent = `Error: ${e.message}`;
      }
    });

    checkAuth();
  </script>
</body>
</html>
